name: copilot-vscode
tier: partial
manifest: plugin.json
hook_format: copilot
agent_format: copilot
# PascalCase event names select the snake_case payload.
payload: snake
output: nested
hook_events:
  session-start: SessionStart
  prompt: UserPromptSubmit
  post-tool: PostToolUse
  pre-compact: PreCompact
  stop: Stop
capabilities:
  read: [view]
  search: [bash]
  shell-read: [bash]
  shell: [bash]
  edit: [edit, create]
  web: [web_fetch]
  subagents: [task]
models:
  fast: fast
  strong: strong
